<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Okta Auth Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo { font-size: 48px; margin-bottom: 16px; }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }

        .btn-primary {
            background: #007dc1;
            color: white;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #333;
        }

        .error {
            background: #fff0f0;
            color: #cc0000;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .info-box {
            margin-top: 28px;
            padding: 16px;
            background: #f8f9ff;
            border-radius: 8px;
            text-align: left;
        }

        .info-box p {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            background: #e8f4fd;
            color: #007dc1;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 2px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔐</div>
        <h1>Okta Auth Demo</h1>
        <p class="subtitle">
            A demonstration of OAuth2 + OIDC authentication
            using Okta's Customer Identity Cloud
        </p>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <a href="/login" class="btn btn-primary">Login with Okta</a>
        <a href="/login?screen_hint=signup" class="btn btn-secondary">Create Account</a>

        <div class="info-box">
            <p><strong>What this demo shows:</strong></p>
            <p>
                <span class="badge">Authorization Code Flow</span>
                <span class="badge">PKCE</span>
                <span class="badge">OIDC</span>
                <span class="badge">JWT</span>
                <span class="badge">HttpOnly Cookies</span>
                <span class="badge">CSRF Protection</span>
            </p>
        </div>
    </div>
</body>
</html>
